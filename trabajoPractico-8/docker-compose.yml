services:
  postgres-primary:
    image: postgres:16
    container_name: postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: distribuidas
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d distribuidas"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-replica:
    image: postgres:16
    container_name: postgres-replica
    user: postgres
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      PGDATA: /var/lib/postgresql/data
      REPLICATION_PASSWORD: replicator123
    command: ["bash", "/usr/local/bin/init-replica.sh"]
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./scripts/init-replica.sh:/usr/local/bin/init-replica.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d distribuidas"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  postgres_primary_data:
  postgres_replica_data:
